<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultablue Hub</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(10, 17, 40, 0.45);
            --border-glow: rgba(0, 180, 216, 0.2);
            --accent-cyan: #00b4d8;
            --accent-blue: #0077b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Ultra-Realistic Fluid Metaball Canvas Layout */
        #fluid-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
            filter: blur(24px) contrast(28); /* Precision thresholds to fuse fluid blobs organically */
            background: radial-gradient(circle at 50% 80%, #091e42 0%, #02040a 100%);
        }

        /* App Layout Container */
        .app-container { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }
        
        /* Sharp Premium Top Tab Navigation */
        .tab-bar { 
            display: flex; background-color: rgba(3, 7, 18, 0.6); backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
            padding: 10px 24px 0 24px; gap: 4px;
        }
        .tab-button { 
            padding: 12px 28px; background: none; border: none; color: var(--text-muted); 
            font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; 
            letter-spacing: 0.3px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; border: 1px solid transparent; border-bottom: none;
        }
        .tab-button:hover { color: var(--text-main); background-color: rgba(255, 255, 255, 0.03); }
        .tab-button.active { 
            background-color: var(--card-bg); color: var(--accent-cyan); 
            border-color: rgba(0, 180, 216, 0.25);
            box-shadow: inset 0 2px 0 0 var(--accent-cyan);
        }

        /* Workspace Content Viewports */
        .tab-content { display: none; flex: 1; padding: 20px; text-align: center; box-sizing: border-box; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Cyber-Sharp Glassmorphic Workspace Display */
        .card { 
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 48px; border-radius: 14px; 
            box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 1px 0 rgba(255,255,255,0.1); 
            max-width: 580px; width: 100%; box-sizing: border-box;
            transition: border-color 0.4s ease;
        }
        .card:hover { border-color: rgba(0, 180, 216, 0.2); }

        h1 { font-size: 3.4rem; color: #ffffff; margin: 0 0 12px 0; font-weight: 800; letter-spacing: -1.5px; }
        h1 span { color: var(--accent-cyan); text-shadow: 0 0 40px rgba(0, 180, 216, 0.4); }
        p { color: var(--text-muted); margin: 0 0 40px 0; font-size: 1.05rem; line-height: 1.6; letter-spacing: 0.2px; }
        
        /* Modern Input Component */
        .search-container { width: 100%; display: flex; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border-radius: 8px; overflow: hidden; }
        input { 
            flex: 1; padding: 18px 24px; border: 1px solid rgba(255, 255, 255, 0.1); 
            border-right: none; background-color: rgba(2, 4, 10, 0.7); color: white; 
            font-size: 16px; outline: none; transition: all 0.2s ease;
        }
        input:focus { border-color: var(--accent-cyan); background-color: rgba(2, 4, 10, 0.9); }
        button { 
            padding: 18px 36px; background-color: var(--accent-cyan); border: none; 
            color: #02040a; font-size: 16px; font-weight: 700; cursor: pointer; 
            transition: all 0.2s ease; letter-spacing: 0.5px;
        }
        button:hover { background-color: #00e5ff; transform: translateY(0); box-shadow: 0 0 20px rgba(0, 180, 216, 0.4); }
    </style>
</head>
<body>

    <!-- Ultra-Realistic Low-CPU Fluid Simulation Layer -->
    <canvas id="fluid-canvas"></canvas>

    <!-- UI Overlay Layer -->
    <div class="app-container">
        
        <!-- 1. The Multi-Tab Bar Navigation -->
        <div class="tab-bar">
            <button class="tab-button active" onclick="switchTab(event, 'search-view')">Workspace</button>
            <button class="tab-button" onclick="switchTab(event, 'info-view')">Core System</button>
        </div>

        <!-- Tab Panel 1: Main Gateway -->
        <div id="search-view" class="tab-content active">
            <div class="card">
                <h1>Ulta<span>blue</span></h1>
                <p>High-Performance Anonymous Routing Workspace Engine</p>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Enter a search token..." autofocus>
                    <button onclick="launchProxy()">Execute</button>
                </div>
            </div>
        </div>

        <!-- Tab Panel 2: Diagnostics & Infrastructure Details -->
        <div id="info-view" class="tab-content">
            <div class="card" style="text-align: left; padding: 40px;">
                <h1 style="font-size: 2rem; margin-bottom: 20px;">System Blueprint</h1>
                <p style="margin-bottom: 20px; font-size: 0.95rem;">Node Allocation: <span style="color:var(--accent-cyan)">Render Free Cluster Tier</span></p>
                <p style="margin-bottom: 20px; font-size: 0.95rem;">Network Pipeline: <span style="color:var(--accent-cyan)">Encrypted Secure Ingress TLS</span></p>
                <p style="margin-bottom: 20px; font-size: 0.95rem;">Concurrences Allocation: <span style="color:var(--accent-cyan)">Optimized for 6+ Active Nodes</span></p>
                <p style="font-size: 0.95rem;">Engine State: <span style="color:#2a9d8f">Active Operational</span></p>
            </div>
        </div>
    </div>

    <script>
        // --- 1. PREMIUM TAB INTERACTION LOGIC ---
        function switchTab(event, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function launchProxy() {
            const input = document.getElementById('search-input').value.trim();
            if (!input) return;
            window.location.href = window.location.origin + '/service/html/?q=' + encodeURIComponent(input);
        }

        document.getElementById('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') launchProxy(); });

        // --- 2. ADVANCED METABALL LAVA LAMP ANIMATION (ZERO MULTI-USER LAG DESIGN) ---
        const canvas = document.getElementById('fluid-canvas');
        const ctx = canvas.getContext('2d');
        
        // Downscale processing map resolution strictly to optimize old MacBook Air graphics cards
        let scale = 5; 
        let width = canvas.width = window.innerWidth / scale;
        let height = canvas.height = window.innerHeight / scale;
        
        window.addEventListener('resize', () => { 
            width = canvas.width = window.innerWidth / scale; 
            height = canvas.height = window.innerHeight / scale; 
        });

        const blobs = [];
        // High-end premium deep blue & neon cyan color values
        const gradientColors = ['#005f73', '#0a9396', '#0077b6', '#00b4d8'];

        // Build 5 complex morphing fluid components
        for (let i = 0; i < 5; i++) {
            blobs.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.25, // Slow horizontal drift for realism
                vy: (Math.random() - 0.5) * 0.55,  // Faster vertical drift mimicking heat rise
                radius: Math.random() * 20 + 22,
                color: gradientColors[i % gradientColors.length]
            });
        }

        function renderMetaballs() {
            ctx.clearRect(0, 0, width, height);
            
            // Continuous environment loop
            blobs.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                // Wall bounds containment checks
                if (b.x - b.radius < -20 || b.x + b.radius > width + 20) b.vx *= -1;
                if (b.y - b.radius < -20 || b.y + b.radius > height + 20) b.vy *= -1;

                // Draw metaball element vectors
                ctx.beginPath();
                let gradient = ctx.createRadialGradient(b.x, b.y, b.radius * 0.1, b.x, b.y, b.radius);
                gradient.addColorStop(0, b.color);
                gradient.addColorStop(1, 'transparent');
                
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            });

            requestAnimationFrame(renderMetaballs);
        }
        renderMetaballs();
    </script>
</body>
</html>
