<!DOCTYPE html>https://github.com/orbitreactor1-lab/ultablue-proxy/blob/main/public/index.html
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultablue Workspace</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050a14; color: #e0e1dd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
        }
        #fluid-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
            filter: blur(40px) contrast(20); background: radial-gradient(circle at center, #0a1128 0%, #030712 100%);
        }
        .app-container { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }
        .tab-bar { display: flex; background-color: rgba(12, 22, 49, 0.6); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 180, 216, 0.2); padding: 8px 15px 0 15px; }
        .tab-button { padding: 12px 24px; background: none; border: none; color: #8d99ae; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; margin-right: 5px; transition: all 0.2s ease; }
        .tab-button:hover { background-color: rgba(255, 255, 255, 0.05); color: #e0e1dd; }
        .tab-button.active { background-color: rgba(5, 10, 20, 0.8); color: #00b4d8; border: 1px solid rgba(0, 180, 216, 0.3); border-bottom: 1px solid #050a14; box-shadow: 0 -4px 12px rgba(0, 180, 216, 0.1); }
        .tab-content { display: none; flex: 1; padding: 40px 20px; text-align: center; box-sizing: border-box; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: rgba(11, 19, 43, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(0, 180, 216, 0.15); padding: 40px; border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); max-width: 600px; width: 100%; }
        h1 { font-size: 3.5rem; color: #00b4d8; margin: 0 0 10px 0; font-weight: 800; letter-spacing: -1px; text-shadow: 0 0 20px rgba(0, 180, 216, 0.3); }
        p { color: #8d99ae; margin: 0 0 35px 0; font-size: 1.1rem; }
        .search-container { width: 100%; display: flex; }
        input { flex: 1; padding: 16px 20px; border: 2px solid rgba(0, 180, 216, 0.3); border-radius: 10px 0 0 10px; background-color: rgba(5, 10, 20, 0.8); color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #00b4d8; box-shadow: 0 0 15px rgba(0, 180, 216, 0.2); }
        button { padding: 16px 30px; background-color: #00b4d8; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 0 10px 10px 0; cursor: pointer; }
        button:hover { background-color: #0077b6; }
    </style>
</head>
<body>

    <canvas id="fluid-canvas"></canvas>

    <div class="app-container">
        <div class="tab-bar">
            <button class="tab-button active" onclick="switchTab(event, 'search-view')">Web Search</button>
            <button class="tab-button" onclick="switchTab(event, 'wiki-view')">Wiki Lookup</button>
        </div>

        <!-- Tab Content 1: General Web Proxy Search -->
        <div id="search-view" class="tab-content active">
            <div class="card">
                <h1>Ultablue Search</h1>
                <p>Anonymized Secure Routing</p>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Type what you want to find..." autofocus>
                    <button onclick="launchWebProxy()">Go</button>
                </div>
            </div>
        </div>

        <!-- Tab Content 2: Wikipedia Specific Sub-route -->
        <div id="wiki-view" class="tab-content">
            <div class="card">
                <h1>Ultablue Wiki</h1>
                <p>Direct Encrypted Encyclopedia Gateway</p>
                <div class="search-container">
                    <input type="text" id="wiki-input" placeholder="Search an article topic...">
                    <button onclick="launchWikiProxy()">Fetch</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(event, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Action routing rules
        function launchWebProxy() {
            const input = document.getElementById('search-input').value.trim();
            if (!input) return;
            window.location.href = window.location.origin + '/search/html/?q=' + encodeURIComponent(input);
        }

        function launchWikiProxy() {
            const input = document.getElementById('wiki-input').value.trim();
            if (!input) return;
            window.location.href = window.location.origin + '/wiki?search=' + encodeURIComponent(input);
        }

        document.getElementById('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') launchWebProxy(); });
        document.getElementById('wiki-input').addEventListener('keypress', e => { if (e.key === 'Enter') launchWikiProxy(); });

        // Background script rendering logic
        const canvas = document.getElementById('fluid-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth / 4;
        let height = canvas.height = window.innerHeight / 4;
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth / 4; height = canvas.height = window.innerHeight / 4; });

        const blobs = [];
        const colors = ['#0077b6', '#00b4d8', '#03045e', '#90e0ef'];
        for (let i = 0; i < 6; i++) {
            blobs.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, radius: Math.random() * 25 + 20, color: colors[i % colors.length] });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            blobs.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > width) b.vx *= -1;
                if (b.y < 0 || b.y > height) b.vy *= -1;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
