<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultablue Hub</title><style>:root{--bg-color:#030712;--card-bg:rgba(10,17,40,.45);--accent-cyan:#00b4d8;--text-main:#f8fafc;--text-muted:#94a3b8}body{margin:0;padding:0;background-color:var(--bg-color);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh;width:100vw;-webkit-font-smoothing:antialiased}#fluid-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;filter:blur(24px) contrast(28);background:radial-gradient(circle at 50% 80%,#091e42 0%,#02040a 100%)}.app-container{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column}.tab-bar{display:flex;background-color:rgba(3,7,18,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:10px 24px 0 24px;gap:4px}.tab-button{padding:12px 28px;background:none;border:none;color:var(--text-muted);font-size:.9rem;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;letter-spacing:.3px;transition:all .2s ease;border:1px solid transparent;border-bottom:none}.tab-button:hover{color:var(--text-main);background-color:rgba(255,255,255,.03)}.tab-button.active{background-color:var(--card-bg);color:var(--accent-cyan);border-color:rgba(0,180,216,.25);box-shadow:inset 0 2px 0 0 var(--accent-cyan)}.tab-content{display:none;flex:1;padding:20px;text-align:center;box-sizing:border-box}.tab-content.active{display:flex;flex-direction:column;align-items:center;justify-content:center}.card{background:var(--card-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);padding:48px;border-radius:14px;box-shadow:0 24px 60px -15px rgba(0,0,0,.7),inset 0 1px 1px 0 rgba(255,255,255,.1);max-width:580px;width:100%;box-sizing:border-box;transition:border-color .4s ease}.card:hover{border-color:rgba(0,180,216,.2)}.card.full-viewport{max-width:95%;height:90%;padding:15px;display:flex;flex-direction:column;gap:15px}h1{font-size:3.4rem;color:#fff;margin:0 0 12px 0;font-weight:800;letter-spacing:-1px}h1 span{color:var(--accent-cyan);text-shadow:0 0 40px rgba(0,180,216,.4)}p{color:var(--text-muted);margin:0 0 40px 0;font-size:1.05rem;line-height:1.6}.search-container{width:100%;display:flex;box-shadow:0 4px 20px rgba(0,0,0,.4);border-radius:8px;overflow:hidden}input{flex:1;padding:18px 24px;border:1px solid rgba(255,255,255,.1);border-right:none;background-color:rgba(2,4,10,.7);color:#fff;font-size:16px;outline:none;transition:all .2s ease}input:focus{border-color:var(--accent-cyan);background-color:rgba(2,4,10,.9)}button{padding:18px 36px;background-color:var(--accent-cyan);border:none;color:#02040a;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s ease;letter-spacing:.5px}button:hover{background-color:#00e5ff;box-shadow:0 0 20px rgba(0,180,216,.4)}.viewport-wrapper{display:none;width:100%;flex:1;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background-color:#fff}.viewport-frame{width:100%;height:100%;border:none}</style></head><body><canvas id="fluid-canvas"></canvas><div class="app-container"><div class="tab-bar"><button class="tab-button active" onclick="switchTab(event,'search-view')">Workspace</button><button class="tab-button" onclick="switchTab(event,'info-view')">Core System</button></div><div id="search-view" class="tab-content active"><div class="card" id="workspace-card"><div id="search-interface"><h1>Ulta<span>blue</span></h1><p>High-Performance Anonymous Routing Workspace Engine</p><div class="search-container"><input type="text" id="search-input" placeholder="Enter a search token..." autofocus><button onclick="launchProxy()">Execute</button></div></div><div class="viewport-wrapper" id="internal-viewport"><div style="display:flex;gap:10px;margin-bottom:10px;width:100%"><button onclick="closeViewport()" style="padding:10px 20px;font-size:14px;background:#e63946;color:#fff;border-radius:6px">✕ Close Tab</button></div><iframe class="viewport-frame" id="search-frame" src=""></iframe></div></div></div><div id="info-view" class="tab-content"><div class="card" style="text-align:left;padding:40px"><h1 style="font-size:2rem;margin-bottom:20px">System Blueprint</h1><p style="margin-bottom:20px;font-size:.95rem">Node Allocation: <span style="color:var(--accent-cyan)">Render Free Cluster Tier</span></p><p style="margin-bottom:20px;font-size:.95rem">Network Pipeline: <span style="color:var(--accent-cyan)">Encrypted Secure Ingress TLS</span></p><p style="margin-bottom:20px;font-size:.95rem">Concurrences Allocation: <span style="color:var(--accent-cyan)">Optimized for 6+ Active Nodes</span></p><p style="font-size:.95rem">Engine State: <span style="color:#2a9d8f">Active Operational</span></p></div></div></div><script>function switchTab(e,t){document.querySelectorAll(".tab-content").forEach(e=>e.classList.remove("active")),document.querySelectorAll(".tab-button").forEach(e=>e.className.remove("active")),document.getElementById(t).classList.add("active"),e.currentTarget.classList.add("active")}function launchProxy(){const e=document.getElementById("search-input").value.trim();if(e){const t=window.location.origin+"/search/html/?q="+encodeURIComponent(e);document.getElementById("search-interface").style.display="none",document.getElementById("workspace-card").classList.add("full-viewport");const n=document.getElementById("search-frame"),o=document.getElementById("internal-viewport");n.src=t,o.style.display="flex",o.style.flexDirection="column"}}function closeViewport(){document.getElementById("search-frame").src="",document.getElementById("internal-viewport").style.display="none",document.getElementById("workspace-card").classList.remove("full-viewport"),document.getElementById("search-interface").style.display="block"}document.getElementById("search-input").addEventListener("keypress",e=>{"Enter"===e.key&&launchProxy()});const canvas=document.getElementById("fluid-canvas"),ctx=canvas.getContext("2d");let scale=5,width=canvas.width=window.innerWidth/scale,height=canvas.height=window.innerHeight/scale;window.addEventListener("resize",()=>{width=canvas.width=window.innerWidth/scale,height=canvas.height=window.innerHeight/scale});const blobs=[],gradientColors=["#005f73","#0a9396","#0077b6","#00b4d8"];for(let e=0;e<5;e++)blobs.push({x:Math.random()*width,y:Math.random()*height,vx:.25*(Math.random()-.5),vy:.55*(Math.random()-.5),radius:20*Math.random()+22,color:gradientColors[e%gradientColors.length]});function renderMetaballs(){ctx.clearRect(0,0,width,height),blobs.forEach(e=>{e.x+=e.vx,e.y+=e.vy,(e.x-e.radius<-20||e.x+e.radius>width+20)&&(e.vx*=-1),(e.y-e.radius<-20||e.y+e.radius>height+20)&&(e.vy*=-1),ctx.beginPath();let t=ctx.createRadialGradient(e.x,e.y,.1*e.radius,e.x,e.y,e.radius);t.addColorStop(0,e.color),t.addColorStop(1,"transparent"),ctx.arc(e.x,e.y,e.radius,0,2*Math.PI),ctx.fillStyle=t,ctx.fill()}),requestAnimationFrame(renderMetaballs)}renderMetaballs();</script></body></html>
